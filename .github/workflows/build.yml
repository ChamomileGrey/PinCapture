# CI: run tests and build the Windows installer.
#  - every push / pull request: tests + installer build, setup uploaded as a workflow artifact
#  - tag "vX.Y.Z" (must equal APP_VERSION in pincapture.py): also creates a DRAFT GitHub Release
#    with the setup and PinCapture-Math-<version>.zip (built by installer/build_math_pack.py)
# Status: restored 2026-10-26 (left out of the initial push for a token-scope reason).
# The Inno Setup step treats choco exit 3010 (reboot requested) as success and checks Korean.isl,
# which PinCapture.iss needs. See docs/RELEASE.md if the first run fails.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for the draft release on tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # cp1252 is the default console on windows-latest. build.py also reconfigures
      # its own stdout; this covers pytest failure text and any child Python process.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path pincapture.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != APP_VERSION v$ver" }

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          function Find-Iscc { $paths | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $found = Find-Iscc
          if (-not $found) {
            choco install innosetup -y --no-progress
            # 3010 = success, reboot requested. Failing the step here skips a finished install.
            if ($LASTEXITCODE -eq 3010) { $global:LASTEXITCODE = 0 }
            $found = Find-Iscc
          }
          if (-not $found) { throw "ISCC.exe not found after install" }
          $isl = Join-Path (Split-Path $found) "Languages\Korean.isl"
          if (-not (Test-Path $isl)) { throw "Korean.isl missing: $isl" }
          Write-Host "ISCC: $found"

      - name: Build installer
        run: python installer/build.py

      - name: Build optional math pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: python installer/build_math_pack.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: PinCapture-setup
          path: installer/output/*

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installer/output/*
